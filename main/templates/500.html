{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — مهدی تقدیسی</title>
  <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
  <style>
    /* fallback inline styles in case the stylesheet itself fails to load */
    html,body{margin:0;background:#08080b;color:#f4f4f6;font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;}
    .err-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
    .err-code{font-size:clamp(48px,10vw,96px);font-weight:800;color:#ff5b2e;margin:0;line-height:1;}
    .err-title{font-size:20px;margin:14px 0 8px;}
    .err-desc{color:#a1a1aa;max-width:420px;line-height:1.9;margin:0 0 26px;}
    .err-btn{padding:12px 28px;border-radius:999px;background:linear-gradient(120deg,#ff5b2e,#ffa14a);color:#fff;text-decoration:none;font-weight:600;font-size:14px;}
  </style>
</head>
<body>
  <div class="err-wrap">
    <p class="err-code">500</p>
    <h1 class="err-title">خطای داخلی سرور</h1>
    <p class="err-desc">یه مشکل غیرمنتظره پیش اومد. لطفاً چند لحظه دیگه دوباره امتحان کن؛ اگه ادامه داشت به من اطلاع بده.</p>
    <a class="err-btn" href="{% url 'main:landing' %}">بازگشت به صفحه اصلی</a>
  </div>
  <script src="{% static 'main/js/theme.js' %}"></script>
</body>
</html>
