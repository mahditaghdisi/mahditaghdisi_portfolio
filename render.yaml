services:
  - type: web
    name: mahditaghdisi-portfolio
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "mahditaghdisi.ir,www.mahditaghdisi.ir,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mahditaghdisi.ir,https://www.mahditaghdisi.ir"
      - key: DATABASE_URL
        fromDatabase:
          name: mahditaghdisi-db
          property: connectionString
databases:
  - name: mahditaghdisi-db
    plan: free
